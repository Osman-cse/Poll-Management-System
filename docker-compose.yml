version: '3.8'

services:
  # 1. Database Service (MariaDB)
  db:
    image: mariadb:latest
    container_name: myproject-db-container
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: asdf1234
      MARIADB_DATABASE: myproject
    ports:
      - "3306:3306"
    volumes:
      - ./myproject-backend/db/db-data:/var/lib/mysql
    # NEW: Tells Docker how to check if the DB is actually ready
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend Service (Spring Boot)
  backend:
    build:
      context: ./myproject-backend
      dockerfile: Dockerfile
    container_name: myproject-backend-container
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://myproject-db-container:3306/myproject?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=asdf1234
    # NEW: Forces the backend to wait for the DB healthcheck to pass
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./myproject-frontend
      dockerfile: Dockerfile
    container_name: myproject-frontend-container
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend